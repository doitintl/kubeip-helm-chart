name: Release Charts

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Validate chart
        run: |
          helm lint charts/kubeip --strict
          helm template kubeip charts/kubeip > rendered.yaml
          helm template kubeip charts/kubeip --set image.tag=test-version --set daemonSet.env.WAIT_FOR_NODE_ADDRESS=false --set daemonSet.env.LABEL_ASSIGNED_ADDRESS=true --set rbac.allowNodesPatchPermission=true > rendered.yaml
          grep -F 'image: "doitintl/kubeip-agent:test-version"' rendered.yaml
          grep -A1 'name: WAIT_FOR_NODE_ADDRESS' rendered.yaml | grep -F 'value: "false"'
          grep -A1 'name: LABEL_ASSIGNED_ADDRESS' rendered.yaml | grep -F 'value: "true"'
          helm template kubeip charts/kubeip --set cloudProvider=aws --set-string serviceAccount.annotations.awsRoleArn=arn:aws:iam::123456789012:role/kubeip-lab --set-string daemonSet.env.FILTER= --set-string daemonSet.env.AWS_IPAM_POOL_ID=ipam-pool-lab --set rbac.allowNodesPatchPermission=true --set daemonSet.env.RELEASE_ON_EXIT=false > rendered.yaml
          grep -A1 'name: AWS_IPAM_POOL_ID' rendered.yaml | grep -F 'value: "ipam-pool-lab"'
          grep -A1 'name: RELEASE_ON_EXIT' rendered.yaml | grep -F 'value: "false"'
          helm template kubeip charts/kubeip --set-string daemonSet.env.METRICS_ADDRESS=:8080 --set-string daemonSet.env.RECONCILE_INTERVAL=30s --set daemonSet.env.RELEASE_ON_EXIT=false --set rbac.allowNodesPatchPermission=true > rendered.yaml
          grep -A1 'name: METRICS_ADDRESS' rendered.yaml | grep -F 'value: ":8080"'
          grep -A1 'name: RECONCILE_INTERVAL' rendered.yaml | grep -F 'value: "30s"'
          grep -A1 'name: AWS_IPAM_POOL_ID' rendered.yaml | grep -F 'value: ""'
          helm template kubeip charts/kubeip --set-string daemonSet.env.COMPLETION_TAINT_KEY=kubeip.com/pending --set-string daemonSet.env.TAINT_KEY=kubeip.com/not-ready --set daemonSet.env.RELEASE_ON_EXIT=false --set rbac.allowNodesPatchPermission=true > rendered.yaml
          grep -A1 'name: COMPLETION_TAINT_KEY' rendered.yaml | grep -F 'value: "kubeip.com/pending"'
          if helm template kubeip charts/kubeip --set-string daemonSet.env.AWS_IPAM_POOL_ID=ipam-pool-lab; then
            echo "IPAM must reject the GCP provider"
            exit 1
          fi

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Release chart and update index
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy chart repository
        id: deployment
        uses: actions/deploy-pages@v4
