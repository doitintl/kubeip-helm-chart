{{- if .Values.daemonSet.env.AWS_IPAM_POOL_ID }}
{{- if ne .Values.cloudProvider "aws" }}
{{- fail "AWS_IPAM_POOL_ID requires cloudProvider=aws" }}
{{- end }}
{{- if .Values.daemonSet.env.FILTER }}
{{- fail "AWS_IPAM_POOL_ID requires an empty FILTER" }}
{{- end }}
{{- if and .Values.rbac.create (not .Values.rbac.allowNodesPatchPermission) }}
{{- fail "AWS_IPAM_POOL_ID requires rbac.allowNodesPatchPermission=true" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubeip.fullname" . }}
  labels:
    {{- include "kubeip.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubeip.name" . }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubeip.name" . }}
    spec:
      serviceAccountName: {{ include "kubeip.serviceAccountName" . | quote }}
      terminationGracePeriodSeconds: {{ .Values.daemonSet.terminationGracePeriodSeconds }}
      priorityClassName: {{ .Values.daemonSet.priorityClassName | quote }}
      nodeSelector:
{{- if .Values.daemonSet.nodeSelector }}
{{- toYaml .Values.daemonSet.nodeSelector | nindent 8 }}
{{- end }}
      tolerations:
        - operator: "Exists"
          effect: "NoSchedule"
        - operator: "Exists"
          effect: "NoExecute"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: kubeip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          resources:
{{- toYaml .Values.daemonSet.resources | nindent 12 }}
          {{- if eq .Values.cloudProvider "oci" }}
          volumeMounts:
            - name: oci-config
              mountPath: /root/.oci
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FILTER
              value: {{ .Values.daemonSet.env.FILTER | quote }}
            - name: TAINT_KEY
              value: {{ .Values.daemonSet.env.TAINT_KEY | quote }}
            - name: LABEL_ASSIGNED_ADDRESS
              value: {{ .Values.daemonSet.env.LABEL_ASSIGNED_ADDRESS | default false | quote }}
            - name: METRICS_ADDRESS
              value: {{ .Values.daemonSet.env.METRICS_ADDRESS | default "" | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.daemonSet.env.RECONCILE_INTERVAL | default "0s" | quote }}
            - name: COMPLETION_TAINT_KEY
              value: {{ .Values.daemonSet.env.COMPLETION_TAINT_KEY | default "" | quote }}
            - name: AWS_IPAM_POOL_ID
              value: {{ .Values.daemonSet.env.AWS_IPAM_POOL_ID | default "" | quote }}
            - name: RELEASE_ON_EXIT
              value: {{ .Values.daemonSet.env.RELEASE_ON_EXIT | quote }}
            - name: WAIT_FOR_NODE_ADDRESS
              value: {{ .Values.daemonSet.env.WAIT_FOR_NODE_ADDRESS | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.daemonSet.env.LOG_LEVEL | quote }}
            - name: LOG_JSON
              value: {{ .Values.daemonSet.env.LOG_JSON | quote }}
            {{- if eq .Values.cloudProvider "oci" }}
            - name: OCI_CONFIG_FILE
              value: /root/.oci/config
            {{- end }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      {{- if eq .Values.cloudProvider "oci" }}
      volumes:
        - name: oci-config
          secret:
            secretName: oci-config
      {{- end }}
